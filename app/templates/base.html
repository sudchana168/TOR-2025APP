<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOR Reminder App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-900">
    <div class="min-h-screen flex flex-col">
        <nav class="bg-white shadow-sm border-b border-gray-200">
            <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16">
                    <div class="flex">
                        <div class="flex-shrink-0 flex items-center">
                            <a href="/"
                                class="text-xl font-bold text-indigo-600 hover:text-indigo-700 transition-colors">TOR
                                Reminder</a>
                        </div>
                        <div class="hidden sm:ml-6 sm:flex sm:space-x-8">
                            <a href="/"
                                class="border-indigo-500 text-gray-900 inline-flex items-center px-1 pt-1 border-b-2 text-sm font-medium">
                                Dashboard
                            </a>
                            <!-- Add more links here if needed -->
                        </div>
                    </div>
                    <div class="flex items-center">
                        {% if request.url.path != '/login' %}
                        <a href="/logout"
                            class="ml-4 px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors shadow-sm">
                            Logout
                        </a>
                        {% endif %}
                    </div>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
            {% block content %}{% endblock %}
        </main>

        <footer class="bg-white border-t border-gray-200 mt-auto">
            <div class="max-w-7xl mx-auto py-6 px-4 sm:px-6 lg:px-8">
                <p class="text-center text-sm text-gray-500">&copy; 2025 TOR Reminder App. All rights reserved.</p>
            </div>
        </footer>
    </div>

    <!-- Upload Modal -->
    <div id="uploadModal" class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-lg p-6 max-w-md w-full shadow-xl">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Upload Excel File</h3>
            <form id="uploadForm" class="space-y-4">

                <!-- Template Selection -->
                <div>
                    <label for="templateType" class="block text-sm font-medium text-gray-700">Template Type</label>
                    <select id="templateType" name="templateType"
                        class="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                        <option value="default">Default Template</option>
                        <option value="master_meter">New Template</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700">Select File</label>
                    <input type="file" id="fileInput" accept=".xlsx, .xls"
                        class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
                </div>

                <!-- Sheet Selection (Hidden by default) -->
                <div id="sheetSelectionContainer" class="hidden">
                    <label for="sheetName" class="block text-sm font-medium text-gray-700">Select Sheet</label>
                    <div class="flex items-center space-x-2 mt-1">
                        <select id="sheetName" name="sheetName"
                            class="block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm rounded-md">
                            <!-- Populated dynamically -->
                        </select>
                        <span id="loadingSheets" class="hidden text-sm text-indigo-600">Loading...</span>
                    </div>
                </div>

                <div class="flex justify-end space-x-3 mt-6">
                    <button type="button" onclick="closeUploadModal()"
                        class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-md text-sm font-medium hover:bg-gray-50">
                        Cancel
                    </button>
                    <button type="submit" id="uploadSubmitBtn"
                        class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">
                        Upload
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        function closeUploadModal() {
            document.getElementById('uploadModal').classList.add('hidden');
            document.getElementById('uploadForm').reset();
            document.getElementById('sheetSelectionContainer').classList.add('hidden');
            document.getElementById('sheetName').innerHTML = '';
        }

        document.getElementById('fileInput').addEventListener('change', async (e) => {
            const file = e.target.files[0];
            const templateType = document.getElementById('templateType').value;
            const projectId = "{{ project.id if project else '' }}";

            if (!file || !projectId) return;

            // Optional: You could always show sheet selector or only for master_meter. Let's do it always if a file is uploaded.
            const container = document.getElementById('sheetSelectionContainer');
            const select = document.getElementById('sheetName');
            const loading = document.getElementById('loadingSheets');

            container.classList.remove('hidden');
            select.disabled = true;
            loading.classList.remove('hidden');

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`/projects/${projectId}/upload/sheets`, {
                    method: 'POST',
                    body: formData
                });
                if (response.ok) {
                    const data = await response.json();
                    select.innerHTML = data.sheets.map(sheet => `<option value="${sheet}">${sheet}</option>`).join('');
                } else {
                    select.innerHTML = `<option value="">Error loading sheets</option>`;
                }
            } catch (err) {
                select.innerHTML = `<option value="">Error loading sheets</option>`;
            } finally {
                select.disabled = false;
                loading.classList.add('hidden');
            }
        });

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files[0]) return;

            const projectId = "{{ project.id if project else '' }}";
            if (!projectId) {
                alert("Cannot upload without a selected project.");
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('template_type', document.getElementById('templateType').value);

            const sheetName = document.getElementById('sheetName').value;
            if (sheetName) {
                formData.append('sheet_name', sheetName);
            }

            const btn = document.getElementById('uploadSubmitBtn');
            btn.disabled = true;
            btn.innerText = 'Uploading...';

            try {
                const response = await fetch(`/projects/${projectId}/upload/`, {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    alert('File uploaded successfully!');
                    window.location.reload();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.detail);
                }
            } catch (err) {
                alert('Upload failed');
            } finally {
                btn.disabled = false;
                btn.innerText = 'Upload';
            }
        });
    </script>
</body>

</html>
